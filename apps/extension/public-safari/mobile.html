<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tweet Helper</title>
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="mobile-shell">
  <header><strong>Tweet Helper</strong><span>Keep this sheet open while scanning</span></header>
  <nav aria-label="Workspace">
    <button data-view="today" aria-selected="true">Today</button>
    <button data-view="queue">Queue</button>
    <button data-view="explore">Ideas</button>
    <button data-view="tools">Tools</button>
  </nav>
  <main id="app" tabindex="-1"></main>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
