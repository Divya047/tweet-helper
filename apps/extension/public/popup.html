<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tweet Helper</title>
    <style>
      body {
        min-width: 320px;
        margin: 0;
        padding: 16px;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f8fafc;
        letter-spacing: 0;
      }
      .header {
        margin-bottom: 14px;
      }
      .title {
        font-size: 15px;
        font-weight: 760;
        line-height: 1.15;
      }
      .subtitle {
        margin-top: 3px;
        color: #64748b;
        font-size: 12px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #475569;
        font-size: 12px;
        font-weight: 680;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid rgba(203, 213, 225, 0.95);
        border-radius: 8px;
        color: #0f172a;
        background: #fff;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        min-height: 36px;
        padding: 8px 10px;
        border: 1px solid rgba(203, 213, 225, 0.95);
        border-radius: 8px;
        color: #0f172a;
        background: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }
      button.primary {
        border-color: #0f172a;
        background: #0f172a;
        color: #fff;
      }
      button:hover:not([disabled]) {
        border-color: #94a3b8;
        background: #f8fafc;
      }
      button.primary:hover:not([disabled]) {
        border-color: #1e293b;
        background: #1e293b;
      }
      button[disabled] {
        opacity: 0.58;
        cursor: not-allowed;
      }
      .status {
        min-height: 18px;
        margin-top: 12px;
        padding: 9px 10px;
        border-radius: 8px;
        background: #fff;
        color: #475569;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">Tweet Helper</div>
      <div class="subtitle">Local backend connection</div>
    </div>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="url" value="http://127.0.0.1:4317" />
    <div class="actions">
      <button class="primary" id="save">Save</button>
      <button id="check">Check</button>
    </div>
    <div id="status" class="status"></div>
    <script type="module" src="/popup.js"></script>
  </body>
</html>
