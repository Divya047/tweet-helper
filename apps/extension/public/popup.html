<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tweet Helper</title>
    <style>
      body {
        min-width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 650;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      button {
        margin-top: 10px;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: #111827;
        cursor: pointer;
      }
      .status {
        margin-top: 10px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="url" value="http://127.0.0.1:4317" />
    <button id="save">Save</button>
    <button id="check">Check Backend</button>
    <div id="status" class="status"></div>
    <script type="module" src="/popup.js"></script>
  </body>
</html>
